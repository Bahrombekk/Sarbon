[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarbon"
version = "0.2.0"
description = "Real-time detector + tracker for fixed cameras (RailSafe railway crossings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# PyTorch / torchvision are installed separately (CUDA 12.8 build for RTX 50xx), see README.
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.9",
    "scipy>=1.11",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["triton-windows>=3.2; sys_platform == 'win32'", "triton>=3.2; sys_platform != 'win32'"]
pretrain = ["timm>=1.0"]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
sarbon-train = "sarbon.cli.train:main"
sarbon-pretrain = "sarbon.cli.pretrain:main"
sarbon-train-track = "sarbon.cli.train_track:main"
sarbon-run = "sarbon.cli.run:main"
sarbon-compare = "sarbon.cli.compare:main"
sarbon-export = "sarbon.cli.export:main"

[tool.setuptools.packages.find]
include = ["sarbon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# GPU-only tests are scripts run by hand (tests/test_*_gpu.py, tests/test_fused_engine.py)
addopts = "-q --ignore=tests/test_pipeline_gpu.py"
