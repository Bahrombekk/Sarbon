# Wide backbone (stem 48/96/192, depths 2/3, stride-16 384 ch; 18.5M params) with the same recipe
# as coco_s.yaml. In the 24-epoch from-scratch ablation it gave AP 32.2 / AP_small 13.9 against
# 30.2 / 11.0 for the default backbone, at +3% (1 camera) / +25% (4 cameras) TensorRT latency.
# Init: DINOv2 distillation of the same backbone (jobs\wide_pipeline.ps1 runs it first).
coco: C:/data/coco
size: s
widths: "48,96,192"
depths: "2,3"
c16: 384
epochs: 72
batch: 16
workers: 12
no_halo_zero: true
init: runs/pretrain/s_wide_distill.pt
tag: _wide_distill
out: runs/sarbon
resume: true
