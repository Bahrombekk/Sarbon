# Product detector v0.2 candidate: railsafe_s.yaml + people from the own "smart" depot/workshop
# cameras (C:/data/smart_split, person only; helmet classes ignored). Same recipe as v0.1, so
# any change in own_AP / person AP comes from the added data.
coco: C:/data/coco
taxonomy: railsafe
yolo: C:/data/pereezd_split
yolo_map: "0:3,1:4"
own:
  - C:/data/smart_split=0:0
init: runs/sarbon/s_distill/best.pt
init_classes: surveillance
size: s
epochs: 24
no_aug_epochs: 2
lr: 2.0e-4
batch: 16
workers: 12
no_halo_zero: true
eval_every: 2
tag: _railsafe_smart
out: runs/railsafe
resume: true
